# Site identity
title: blank
first_name: Yingting
middle_name:
last_name: Gao
tagline: Researcher, Designer
description: Academic portfolio of Yingting Gao, a Human-Centered Computing researcher working across sustainable materials, biodesign, and HCI.
keywords: human-computer interaction, sustainable HCI, biomaterials, biodesign, material-driven design, biofabrication
lang: en
icon: yingting-gao-icon.svg

# GitHub Pages URL
url: https://yingtinggao666-ctrl.github.io
baseurl:

# Layout
max_width: 1180px
serve_og_meta: false
og_image:

include:
  - _pages

# Jekyll
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false

permalink: pretty
future: true
encoding: utf-8
strict_front_matter: false

sass:
  style: compressed

plugins:
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap

# Compatibility for jekyll-3rd-party-libraries, which is still present in the
# existing Gemfile/lockfile. The current site loads no libraries through it.
third_party_libraries: {}

# Publications
scholar:
  last_name: [Gao]
  first_name: [Yingting, Y.]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: reference-papers.bib
  bibliography_template: reference-bib
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  query: "@*"
  group_by: year
  group_order: descending

# Files that are useful in the repository but should not be copied into the site.
exclude:
  - _projects
  - _posts
  - _pages/about_einstein.md
  - _pages/blog.md
  - _pages/books.md
  - _pages/news.md
  - _pages/profiles.md
  - AGENTS.md
  - CONTENT_GUIDE.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor

keep_files:
  - CNAME
  - .nojekyll
